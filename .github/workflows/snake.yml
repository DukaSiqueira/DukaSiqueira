name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar SVGs (claro e escuro) em azul
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0D1117&color_dots=#EBEDF0,#9ECBFF,#58A6FF,#1F6FEB,#0550AE
            dist/github-snake-dark.svg?color_snake=#FFFFFF&color_dots=#161B22,#0A3069,#0550AE,#1F6FEB,#58A6FF

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
